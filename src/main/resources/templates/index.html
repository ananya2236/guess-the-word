<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Word</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            width: 400px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        a {
            display: block;
            padding: 12px;
            margin: 10px 0;
            text-decoration: none;
            background: #222;
            color: white;
            border-radius: 5px;
        }

        a:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Guess The Word</h1>

    <p>
        Guess the hidden 5-letter word in a maximum of 5 attempts.
    </p>

    <a href="/login">Login</a>

    <a href="/register">Create Account</a>

</div>

</body>
</html>
