<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Word - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: red;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Guess The Word</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register-link">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

<script>

    document.getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            try {

                const response = await fetch(
                    `/api/users/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                    {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    const error = await response.text();
                    message.textContent = error;
                    return;
                }

                const user = await response.json();

                localStorage.setItem(
                    "username",
                    user.username
                );

                localStorage.setItem(
                    "role",
                    user.role
                );

                window.location.href = "/game";

            } catch (error) {

                message.textContent =
                    "Unable to connect to server.";

            }

        });

</script>

</body>
</html>
